id: t2v_default
name: Wan T2V Default
template: ../../../workflows/t2v.json
template_format: ui
mode: text_to_video
output_kind: video
timeout_sec: 2400
required:
  - prompt
defaults:
  negative_prompt: "lowres, blurry, out of focus, bad quality, jpeg artifacts, noisy, overexposed, underexposed, flicker, frame jitter, temporal inconsistency, identity drift, face morphing, duplicate face, deformed body, bad anatomy, bad hands, extra fingers, fused fingers, missing fingers, extra limbs, warped arms, text, watermark, logo"
  seed: -1
  width: 832
  height: 480
  steps: 8
  cfg: 1.0
  fps: 16
  duration_sec: 4
bindings:
  - node: "380"
    input: text
    param: prompt
  - node: "348"
    input: text
    param: negative_prompt
  - node: "381"
    input: value
    param: width
  - node: "381"
    input: Number
    param: width
  - node: "382"
    input: value
    param: height
  - node: "382"
    input: Number
    param: height
  - node: "360"
    input: value
    param: length_frames
  - node: "360"
    input: Number
    param: length_frames
  - node: "361"
    input: value
    param: steps
  - node: "361"
    input: Number
    param: steps
  - node: "217"
    input: value
    param: fps
  - node: "209"
    input: value
    param: duration_sec
  # node 379 是 RIFE 2x 插帧后的输出,播放帧率应为 基础fps×2(模板已写死 32)。
  # 不要把用户的 fps(16)直接绑到它,否则会按 16 播放 → 时长翻倍。
  - node: "218"
    input: frame_rate
    param: fps
