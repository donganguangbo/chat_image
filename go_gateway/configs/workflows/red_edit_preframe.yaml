id: red_edit_preframe
name: RED-Edit Preframe (ICEdit)
template: ../../../workflows/red_edit_preframe.json
template_format: api
mode: image_preframe
output_kind: image
timeout_sec: 1800
required:
  - prompt
  - input_image
defaults:
  model_name: REDEdit_v1.1-F1devFill-ICEdit-fp8.safetensors
  clip_l_name: clip_l.safetensors
  t5_name: t5xxl_fp8_e4m3fn_scaled.safetensors
  vae_name: ae.safetensors
  weight_dtype: fp8_e4m3fn
  seed: -1
  steps: 15
  cfg: 1.0
  sampler_name: euler
  scheduler: normal
  denoise: 1.0
  guidance: 50
  size_long: 1024
