id: t2i_furry
name: Z-Image Furry T2I
template: ../../../workflows/t2i_zimage_darkbeast_furry.json
template_format: api
mode: t2i
output_kind: image
timeout_sec: 1800
required:
  - prompt
  - width
  - height
defaults:
  ckpt_name: ratatoskr_zimage_v1_bf16.safetensors
  clip_name: qwen_3_4b.safetensors
  vae_name: ae.safetensors
  negative_prompt: "lowres, blurry, out of focus, bad quality, jpeg artifacts, overexposed, underexposed, noisy, bad anatomy, deformed body, disfigured face, asymmetrical eyes, cross-eye, duplicate face, identity drift, face morphing, flicker, frame jitter, temporal inconsistency, extra fingers, fused fingers, missing fingers, extra limbs, broken hands, warped arms, text, watermark, logo"
  seed: -1
  steps_stage1: 5
  cfg_stage1: 1.5
  steps_stage2: 20
  cfg_stage2: 1.3
  denoise_stage2: 0.58
  upscale_by: 1.25
  width: 1024
  height: 1024
