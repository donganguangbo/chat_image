id: i2v_wan_remix_single_v30
name: Wan Remix I2V v3.0 (Single Image)
template: ../../../workflows/i2v_wan_remix_single_v30.json
template_format: api
mode: i2v
output_kind: video
timeout_sec: 2400
required:
  - prompt
  - input_image
defaults:
  negative_prompt: "lowres, blurry, out of focus, bad quality, jpeg artifacts, noisy, overexposed, underexposed, flicker, frame jitter, temporal inconsistency, identity drift, face morphing, duplicate face, deformed body, bad anatomy, bad hands, extra fingers, fused fingers, missing fingers, extra limbs, warped arms, text, watermark, logo"
  seed: -1
  steps: 8
  cfg: 1.0
  duration_sec: 4
  fps: 8
  size_long: 832
  lora_stage_node_ids:
    stage1: "279"   # high-noise UNETLoader
    stage2: "280"   # low-noise UNETLoader
