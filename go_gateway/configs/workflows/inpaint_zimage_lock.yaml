id: inpaint_zimage_lock
name: Z-Image Lock Inpaint
template: ../../../workflows/inpaint_zimage_lock.json
template_format: api
mode: image_edit
output_kind: image
timeout_sec: 1800
required:
  - prompt
  - input_image
  - width
  - height
defaults:
  clip_name: qwen_3_4b.safetensors
  vae_name: ae.safetensors
  unet_name_stage1: redcraftFeb1126Latest_zibDistilledDX3Lucis.safetensors
  unet_name_stage2: darkbeastz6BlitzBF16.Vii6.safetensors
  lora_name_aux: REDZ15_DetailDaemonZ_lora_v1.1.safetensors
  lora_name_main: REDZ15_DetailDaemonZ_lora_v1.1.safetensors
  lora_strength_aux: 1.25
  lora_strength_main: -1.5
  steps_stage1: 4
  cfg_stage1: 1.0
  steps_stage2: 14
  cfg_stage2: 1.3
  denoise_stage2: 0.58
  aura_shift: 1.15
  upscale_by: 1.5
  final_scale: 0.75
  refine_enabled: false
  reactor_enabled: true
  reactor_swap_model: inswapper_128.onnx
  reactor_facedetection: retinaface_resnet50
  reactor_face_restore_model: codeformer-v0.1.0.pth
  reactor_face_restore_visibility: 0.8
  reactor_codeformer_weight: 0.5
  reactor_detect_gender_input: "no"
  reactor_detect_gender_source: "no"
  reactor_input_faces_index: "0"
