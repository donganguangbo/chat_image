<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Local Vision Lab</title>
    <link rel="stylesheet" href="/web/styles.css" />
  </head>
  <body>
    <div class="bg-noise"></div>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1>Local Vision Lab</h1>
          <p>ComfyUI Local Gateway Console</p>
        </div>
        <div class="queue-chip">
          <span class="dot"></span>
          <span id="queue-summary">Queue: loading...</span>
        </div>
      </header>

      <div class="layout">
        <section class="workspace card">
          <nav class="tabs" id="tabs">
            <button class="tab-btn active" data-tab="t2i-zimage">Z-Image文生图</button>
            <button class="tab-btn" data-tab="inpaint-zimage">Z-IMAGE锁定生图</button>
            <button class="tab-btn" data-tab="t2v">文生视频</button>
            <button class="tab-btn" data-tab="i2v-remix">Wan Remix图生视频</button>
            <button class="tab-btn" data-tab="gallery">Gallery</button>
            <button class="tab-btn" data-tab="lora">LoRA管理</button>
          </nav>

          <div id="message" class="message hidden"></div>

          <section class="pane active" id="pane-t2i-zimage">
            <form id="t2i-zimage-form" class="form-grid">
              <label>Prompt<textarea name="prompt" required></textarea></label>
              <label>Negative Prompt<textarea name="negative_prompt"></textarea></label>
              <div class="inline">
                <label>类型
                  <select name="zimage_type">
                    <option value="normal" selected>正常</option>
                    <option value="red">Red</option>
                    <option value="futa">扶她</option>
                    <option value="furry">兽人</option>
                  </select>
                </label>
                <label id="t2i-red-chain-wrap" class="hidden">Red链路
                  <select name="red_chain" id="t2i-red-chain">
                    <option value="main" selected>主链（原版主输出）</option>
                    <option value="side">侧链（ModelOnly LoRA）</option>
                    <option value="pose">姿势链（LSP姿态优先）</option>
                  </select>
                </label>
              </div>
              <div class="inline">
                <label>Preset
                  <select name="preset" id="t2i-zimage-preset">
                    <option value="1024x1024">1:1 (1024x1024)</option>
                    <option value="832x1536">RED 推荐 (832x1536)</option>
                    <option value="768x1248">竖图 (768x1248)</option>
                    <option value="1344x768">16:9 (1344x768)</option>
                    <option value="768x1344">9:16 (768x1344)</option>
                  </select>
                </label>
                <label>Seed（每次自动随机）
                  <div class="seed-control">
                    <input type="number" name="seed" value="-1" readonly />
                    <button type="button" class="ghost seed-random-btn">刷新种子</button>
                  </div>
                </label>
              </div>
              <div class="inline">
                <label>Stage1 Steps<input type="number" name="steps_stage1" value="5" min="1" max="60" /></label>
                <label>Stage1 CFG<input type="number" name="cfg_stage1" value="1.5" min="0" max="3" step="0.05" /></label>
              </div>
              <div class="inline">
                <label>Stage2 Steps<input type="number" name="steps_stage2" value="20" min="1" max="120" /></label>
                <label>Stage2 Denoise<input type="number" name="denoise_stage2" value="0.58" min="0" max="1" step="0.01" /></label>
              </div>
              <div class="inline">
                <label>Stage2 CFG<input type="number" name="cfg_stage2" value="1.3" min="0" max="20" step="0.05" /></label>
                <label>Upscale By<input type="number" name="upscale_by" value="1.25" min="1" max="4" step="0.05" /></label>
              </div>
              <div class="inline" id="t2i-lora-strength-row">
                <label>LoRA Aux Strength<input type="number" name="lora_strength_aux" value="1.25" min="-4" max="4" step="0.05" /></label>
                <label>LoRA Main Strength<input type="number" name="lora_strength_main" value="-1.5" min="-4" max="4" step="0.05" /></label>
              </div>
              <input type="hidden" name="width" value="1024" />
              <input type="hidden" name="height" value="1024" />
              <button type="submit" class="primary">Generate Z-Image</button>
              <p class="muted">支持 normal / red / futa / furry。</p>
            </form>
          </section>

          <section class="pane" id="pane-inpaint-zimage">
            <form id="inpaint-zimage-form" class="form-grid">
              <label>脸部参考图（必填）
                <input type="file" name="image" id="inpaint-zimage-image-file" accept="image/*" required />
                <span class="muted" style="font-size:11px">流程：先走 Z-Image 两阶段生成，再 ReActor 换脸和 FaceDetailer 精修。</span>
              </label>
              <label>生图指令<textarea name="prompt" required></textarea></label>
              <label>Negative Prompt<textarea name="negative_prompt"></textarea></label>
              <div class="inline">
                <label>类型
                  <select name="zimage_type">
                    <option value="normal" selected>正常</option>
                    <option value="red">Red</option>
                    <option value="futa">扶她</option>
                    <option value="furry">兽人</option>
                  </select>
                </label>
              </div>
              <div class="inline">
                <label>Preset
                  <select name="preset" id="inpaint-zimage-preset">
                    <option value="576x1088" selected>推荐竖图 (576x1088)</option>
                    <option value="768x1344">高清竖图 (768x1344)</option>
                    <option value="1024x1024">方图 (1024x1024)</option>
                  </select>
                </label>
                <label>Seed（每次自动随机）
                  <div class="seed-control">
                    <input type="number" name="seed" value="-1" readonly />
                    <button type="button" class="ghost seed-random-btn">刷新种子</button>
                  </div>
                </label>
              </div>
              <div class="inline">
                <label>Stage1 Steps<input type="number" name="steps_stage1" value="4" min="1" max="60" /></label>
                <label>Stage2 Steps<input type="number" name="steps_stage2" value="14" min="1" max="80" /></label>
                <label>Stage2 Denoise<input type="number" name="denoise_stage2" value="0.58" min="0" max="1" step="0.01" /></label>
              </div>
              <div class="inline">
                <label>Stage1 CFG<input type="number" name="cfg_stage1" value="1.0" min="0" max="20" step="0.05" /></label>
                <label>Stage2 CFG<input type="number" name="cfg_stage2" value="1.3" min="0" max="20" step="0.05" /></label>
                <label>Upscale By<input type="number" name="upscale_by" value="1.5" min="1" max="4" step="0.05" /></label>
                <label>Final Scale<input type="number" name="final_scale" value="0.75" min="0.1" max="1" step="0.05" /></label>
              </div>
              <div class="inline">
                <label>Aura Shift<input type="number" name="aura_shift" value="1.15" min="0.1" max="4" step="0.01" /></label>
                <label>ReActor Swap Model
                  <input type="text" name="reactor_swap_model" value="inswapper_128.onnx" />
                </label>
                <label>ReActor Face Detection
                  <select name="reactor_facedetection">
                    <option value="retinaface_resnet50" selected>retinaface_resnet50</option>
                    <option value="retinaface_mobile0.25">retinaface_mobile0.25</option>
                    <option value="YOLOv5l">YOLOv5l</option>
                    <option value="YOLOv5n">YOLOv5n</option>
                  </select>
                </label>
              </div>
              <div class="inline">
                <label>面部修复模型
                  <select name="reactor_face_restore_model">
                    <option value="codeformer-v0.1.0.pth" selected>CodeFormer（推荐）</option>
                    <option value="GFPGANv1.4.pth">GFPGAN v1.4</option>
                    <option value="GFPGANv1.3.pth">GFPGAN v1.3</option>
                    <option value="none">不修复</option>
                  </select>
                </label>
                <label>本次精修
                  <select name="refine_enabled">
                    <option value="false" selected>关闭（仅换脸）</option>
                    <option value="true">开启（FaceDetailer）</option>
                  </select>
                </label>
                <label>修复强度
                  <input type="number" name="reactor_face_restore_visibility" value="0.8" min="0.1" max="1" step="0.05" />
                </label>
                <label>CodeFormer Weight
                  <input type="number" name="reactor_codeformer_weight" value="0.5" min="0" max="1" step="0.05" />
                </label>
              </div>
              <div class="inline">
                <label>Input Face Index
                  <input type="text" name="reactor_input_faces_index" value="0" />
                </label>
                <label>Source Face Index
                  <input type="text" name="reactor_source_faces_index" value="0" />
                </label>
              </div>
              <input type="hidden" name="reactor_enabled" value="true" />
              <input type="hidden" name="reactor_detect_gender_input" value="no" />
              <input type="hidden" name="reactor_detect_gender_source" value="no" />
              <input type="hidden" name="reactor_console_log_level" value="1" />
              <input type="hidden" name="width" value="576" />
              <input type="hidden" name="height" value="1088" />
              <button type="submit" class="primary">Generate Z-IMAGE Locked Image</button>
            </form>
          </section>

          <section class="pane" id="pane-t2v">
            <form id="t2v-form" class="form-grid">
              <label>Prompt<textarea name="prompt" required></textarea></label>
              <label>Negative Prompt<textarea name="negative_prompt"></textarea></label>
              <div class="inline">
                <label>Duration(s)<input type="number" name="duration_sec" value="4" min="1" max="60" /></label>
                <label>FPS<input type="number" name="fps" value="16" min="1" max="60" /></label>
                <label>Steps<input type="number" name="steps" value="8" min="1" max="200" /></label>
              </div>
              <div class="inline">
                <label>Width<input type="number" name="width" value="832" min="64" max="4096" /></label>
                <label>Height<input type="number" name="height" value="480" min="64" max="4096" /></label>
                <label>CFG<input type="number" name="cfg" value="1.0" min="0" max="50" step="0.1" /></label>
                <label>Seed<input type="number" name="seed" value="-1" /></label>
              </div>
              <button type="submit" class="primary">Generate Video</button>
            </form>
          </section>

          <section class="pane" id="pane-i2v-remix">
            <form id="i2v-remix-form" class="form-grid">
              <div class="inline">
                <label>链路
                  <select name="chain" id="i2v-remix-chain">
                    <option value="single" selected>单图链（WanImageToVideo）</option>
                    <option value="first_last">首尾帧链（WanFirstLastFrameToVideo）</option>
                  </select>
                </label>
              </div>
              <label>首帧图片<input type="file" name="image" accept="image/*" required /></label>
              <label id="i2v-remix-end-wrap" class="hidden">尾帧图片（仅首尾帧链）
                <input type="file" name="image_end" accept="image/*" />
              </label>
              <label>动作/镜头指令<textarea name="prompt" required></textarea></label>
              <label>Negative Prompt<textarea name="negative_prompt"></textarea></label>
              <div class="inline">
                <label>Duration(s)<input type="number" name="duration_sec" value="4" min="1" max="60" /></label>
                <label>FPS<input type="number" name="fps" value="16" min="1" max="60" /></label>
                <label>Steps<input type="number" name="steps" value="6" min="1" max="120" /></label>
              </div>
              <div class="inline">
                <label>Width<input type="number" name="width" value="832" min="64" max="4096" /></label>
                <label>Height<input type="number" name="height" value="480" min="64" max="4096" /></label>
                <label>CFG<input type="number" name="cfg" value="1.0" min="0" max="20" step="0.1" /></label>
                <label>Seed<input type="number" name="seed" value="-1" /></label>
              </div>
              <button type="submit" class="primary">Generate Wan Remix I2V</button>
              <p class="muted">该分支使用 wan2.2-i2v-rapid-aio-v10-nsfw 底模。</p>
            </form>
          </section>

          <section class="pane" id="pane-gallery">
            <div class="gallery-controls">
              <label>Type
                <select id="gallery-kind">
                  <option value="all">all</option>
                  <option value="image">image</option>
                  <option value="video">video</option>
                </select>
              </label>
              <button class="ghost" id="gallery-refresh" type="button">刷新</button>
            </div>
            <div id="gallery-grid" class="gallery-grid"></div>
          </section>

          <section class="pane" id="pane-lora">
            <div class="lora-grid">
              <article class="lora-card">
                <h3>上传本地 LoRA</h3>
                <form id="lora-upload-form" class="form-grid">
                  <label>LoRA 文件
                    <input type="file" name="file" accept=".safetensors,.pt,.pth,.ckpt,.bin" required />
                  </label>
                  <label class="checkline">
                    <input type="checkbox" name="overwrite" />
                    <span>覆盖同名文件</span>
                  </label>
                  <button type="submit" class="primary">上传 LoRA</button>
                </form>
              </article>

              <article class="lora-card">
                <h3>从 Hugging Face 下载</h3>
                <form id="lora-download-form" class="form-grid">
                  <label>Repo ID
                    <input type="text" name="repo_id" placeholder="owner/repo" required />
                  </label>
                  <label>Filename
                    <input type="text" name="filename" placeholder="folder/name.safetensors" required />
                  </label>
                  <label>保存文件名（可选）
                    <input type="text" name="target_name" placeholder="custom_name.safetensors" />
                  </label>
                  <label>Token（可选）
                    <input type="password" name="token" placeholder="hf_xxx" />
                  </label>
                  <label class="checkline">
                    <input type="checkbox" name="force" />
                    <span>覆盖同名文件</span>
                  </label>
                  <button type="submit" class="primary">下载 LoRA</button>
                </form>
              </article>
            </div>

            <div class="lora-list-head">
              <h3>已安装 LoRA</h3>
              <button id="lora-refresh" type="button" class="ghost">刷新列表</button>
            </div>
            <div id="lora-list" class="lora-list"></div>
          </section>
        </section>

        <aside class="sidebar card">
          <h2>Task Queue</h2>
          <div id="queue-progress-wrap" class="queue-progress-wrap">
            <div id="queue-progress" class="queue-progress"></div>
          </div>
          <p id="queue-detail" class="muted">...</p>
          <div class="sidebar-actions">
            <button id="refresh-tasks" class="ghost" type="button">刷新任务</button>
            <button id="refresh-gallery" class="ghost" type="button">刷新画廊</button>
          </div>
          <div id="task-list" class="task-list"></div>
        </aside>
      </div>
    </main>

    <script src="/web/app.js?v=20260402-wanremix1" defer></script>
  </body>
</html>
