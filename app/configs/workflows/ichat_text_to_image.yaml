id: ichat_text_to_image
name: iChat Text To Image
template: ../../../workflows/ichat_text_to_image.json
template_format: api
mode: t2i
output_kind: image
timeout_sec: 1800
required: [prompt]
defaults:
  seed: -1
  steps: 8
  cfg: 1
  width: 1080
  height: 1920
bindings:
  - node: "116"
    input: seed
    param: seed
  - node: "116"
    input: steps
    param: steps
  - node: "116"
    input: cfg
    param: cfg
  - node: "115"
    input: text
    param: prompt
  - node: "11"
    input: width
    param: width
  - node: "11"
    input: height
    param: height
