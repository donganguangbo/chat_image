expose_workflow_catalog: false
expose_raw_task_create: false
storage_mode: s3
# HMAC shared secret for gateway requests. Env GATEWAY_SECRET overrides this.
gateway_secret: ""

default_workflows:
  image_edit: ichat_image_edit
  text_to_video: ichat_text_to_video
  image_to_video: ichat_image_to_video

s3:
  endpoint: us-ord-10.linodeobjects.com
  region: us-ord-10
  bucket: ichat
  # Fill these on the server, or use S3_ACCESS_KEY / S3_SECRET_KEY env vars.
  access_key: ""
  secret_key: ""
  # Env vars override this file:
  #   S3_ENDPOINT / S3_REGION / S3_BUCKET / S3_ACCESS_KEY / S3_SECRET_KEY
  # storage_mode must be either `s3` or `local`; there is no implicit fallback.

text:
  # Local Qwen backend. The backend must expose POST /v1/chat/completions.
  base_url: http://127.0.0.1:8000
  model: qwen-local
  # Optional bearer token. Prefer TEXT_API_KEY env var if needed.
  api_key: ""
