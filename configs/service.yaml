expose_workflow_catalog: false
expose_raw_task_create: false

default_workflows: {}

s3:
  endpoint: us-ord-10.linodeobjects.com
  region: us-ord-10
  bucket: ichat
  # Credentials are read from the environment, NOT this file:
  #   S3_ACCESS_KEY / S3_SECRET_KEY   (S3_ENDPOINT/S3_REGION/S3_BUCKET also override the above)
  # Leave `bucket` empty to disable object storage (disk-only).
